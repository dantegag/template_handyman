<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="">
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <script>
        document.title = CONFIG.meta.title.split('–')[0] + '– Contacto';
        document.querySelector('meta[name="description"]').content = CONFIG.meta.description;
        tailwind.config = {
            theme: { extend: {
                colors: { bg: CONFIG.colors.bg, bg2: CONFIG.colors.bg2, bg3: CONFIG.colors.bg3, accent: CONFIG.colors.accent, accent2: CONFIG.colors.accent2, textMain: CONFIG.colors.textMain, muted: CONFIG.colors.muted, borderC: 'rgba(255,255,255,0.07)' },
                fontFamily: { sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] }
            }}
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0c0c0c; color: #f0ede8; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0c0c0c; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .mobile-menu { transform: translateX(100%); transition: transform 0.3s ease; }
        .mobile-menu.open { transform: translateX(0); }
        input, textarea, select { background: #141414; border: 1px solid rgba(255,255,255,0.07); color: #f0ede8; border-radius: 0.75rem; padding: 0.75rem 1rem; font-family: inherit; font-size: 0.875rem; transition: border-color 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #f5a623; }
        input::placeholder, textarea::placeholder { color: #555; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 bg-bg/80 backdrop-blur-md border-b border-borderC">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="text-accent font-extrabold text-xl tracking-tight uppercase" id="navLogo"></a>
        <div class="hidden md:flex items-center gap-8 text-sm text-muted" id="navLinks"></div>
        <button class="md:hidden text-textMain" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
</nav>
<div id="mobileMenu" class="mobile-menu fixed top-0 right-0 w-64 h-full z-50 bg-bg2 border-l border-borderC p-6 pt-20">
    <button class="absolute top-5 right-5 text-textMain" onclick="document.getElementById('mobileMenu').classList.remove('open')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="flex flex-col gap-6 text-sm" id="mobileNavLinks"></div>
</div>

<!-- HERO -->
<section class="pt-32 pb-16 px-6">
    <div class="max-w-7xl mx-auto text-center">
        <div class="inline-block mb-6 px-5 py-2 rounded-full border border-accent/30 bg-accent/5 text-accent text-xs font-medium tracking-widest uppercase">
            Contacto
        </div>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold mb-4">
            <span class="text-textMain">HABLEMOS DE </span><span class="text-accent">TU PROYECTO</span>
        </h1>
        <p class="text-muted text-sm sm:text-base max-w-xl mx-auto leading-relaxed" id="heroDesc"></p>
    </div>
</section>

<!-- CONTACTO -->
<section class="py-16 px-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- FORMULARIO -->
        <div class="bg-bg2 border border-borderC rounded-2xl p-8">
            <h2 class="text-2xl font-extrabold text-textMain mb-6">Envianos tu consulta</h2>
            <form id="contactForm" class="space-y-5" onsubmit="handleSubmit(event)">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div><label class="block text-xs text-muted mb-2">Nombre completo *</label><input type="text" name="nombre" required placeholder="Tu nombre"></div>
                    <div><label class="block text-xs text-muted mb-2">Teléfono *</label><input type="tel" name="telefono" required placeholder="221 123-4567"></div>
                </div>
                <div><label class="block text-xs text-muted mb-2">Email</label><input type="email" name="email" placeholder="tu@email.com" class="w-full"></div>
                <div><label class="block text-xs text-muted mb-2">Servicio que necesitás *</label><select id="contactServiceSelect" name="servicio" required class="w-full"></select></div>
                <div><label class="block text-xs text-muted mb-2">Zona / Barrio *</label><input type="text" name="zona" required placeholder="Ej: Centro, Gonnet, City Bell..." class="w-full"></div>
                <div><label class="block text-xs text-muted mb-2">Describí el trabajo que necesitás *</label><textarea name="mensaje" required rows="4" placeholder="Contanos los detalles del trabajo: qué necesitás, medidas aproximadas, urgencia, etc." class="w-full resize-none"></textarea></div>
                <button type="submit" class="w-full bg-accent hover:bg-accent2 text-bg font-semibold py-3.5 rounded-lg transition text-sm">Enviar Consulta</button>
                <p class="text-muted text-xs text-center">Te respondemos en menos de 2 horas · Sin compromiso</p>
            </form>
            <div id="formSuccess" class="hidden text-center py-12">
                <div class="w-16 h-16 mx-auto bg-green-500/20 rounded-full flex items-center justify-center text-green-400 mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                </div>
                <h3 class="text-textMain font-bold text-xl mb-2">¡Consulta enviada!</h3>
                <p class="text-muted text-sm">Te vamos a contactar en menos de 2 horas. Gracias por elegirnos.</p>
            </div>
        </div>
        <!-- INFO -->
        <div class="space-y-6" id="contactInfo"></div>
    </div>
</section>

<!-- MAPA -->
<section class="py-16 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold">
                <span class="text-textMain">NUESTRA </span><span class="text-accent">UBICACIÓN</span>
            </h2>
        </div>
        <div class="bg-bg2 border border-borderC rounded-2xl overflow-hidden" style="height: 400px;" id="mapSection"></div>
    </div>
</section>

<!-- FOOTER -->
<footer class="py-8 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <div id="footerLeft"></div>
        <div class="flex items-center gap-4" id="footerRight"></div>
    </div>
</footer>

<script>
const ICONS = {
    phone: '<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.11 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>',
    mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>',
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>'
};

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function icon(name) { return '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.wrench) + '</svg>'; }
function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }
function handleSubmit(e) {
    e.preventDefault();
    document.getElementById('contactForm').style.display = 'none';
    document.getElementById('formSuccess').classList.remove('hidden');
}

function renderAll() {
    document.body.style.background = CONFIG.colors.bg;
    document.body.style.color = CONFIG.colors.textMain;

    // Nav (contacto.html is the CTA page, highlight CTA button)
    document.getElementById('navLogo').textContent = CONFIG.businessName;
    document.getElementById('navLinks').innerHTML =
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="hover:text-textMain transition">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="bg-accent hover:bg-accent2 text-bg font-semibold px-5 py-2 rounded-lg transition">' + esc(CONFIG.nav.ctaLabel) + '</a>';
    document.getElementById('mobileNavLinks').innerHTML =
        '<a href="index.html" class="text-muted hover:text-textMain transition" onclick="closeMobile()">Inicio</a>' +
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="text-muted hover:text-textMain transition" onclick="closeMobile()">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="text-accent font-semibold" onclick="closeMobile()">' + esc(CONFIG.nav.ctaLabel) + '</a>';

    // Hero
    document.getElementById('heroDesc').textContent = CONFIG.ctaSubtitle;

    // Service select (populate from CONFIG.services)
    document.getElementById('contactServiceSelect').innerHTML =
        '<option value="">Seleccionar servicio...</option>' +
        CONFIG.services.map(function(s) {
            return '<option value="' + esc(s.title) + '">' + esc(s.title) + '</option>';
        }).join('') +
        '<option value="otro">Otro</option>';

    // Contact info cards
    var c = CONFIG.contact;
    document.getElementById('contactInfo').innerHTML =
        '<div class="bg-bg2 border border-borderC rounded-2xl p-7 flex items-start gap-5">' +
            '<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl bg-green-500/10 text-green-400"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg></div>' +
            '<div><h3 class="text-textMain font-bold mb-1">WhatsApp</h3><p class="text-muted text-sm mb-1">' + esc(c.whatsapp.desc) + '</p><p class="text-accent font-semibold text-sm">' + esc(c.whatsapp.num) + '</p></div></div>' +
        '<div class="bg-bg2 border border-borderC rounded-2xl p-7 flex items-start gap-5">' +
            '<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl bg-accent/10 text-accent">' + icon('phone') + '</div>' +
            '<div><h3 class="text-textMain font-bold mb-1">Teléfono</h3><p class="text-muted text-sm mb-1">' + esc(c.tel.desc) + '</p><p class="text-accent font-semibold text-sm">' + esc(c.tel.num) + '</p></div></div>' +
        '<div class="bg-bg2 border border-borderC rounded-2xl p-7 flex items-start gap-5">' +
            '<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl bg-blue-500/10 text-blue-400">' + icon('mail') + '</div>' +
            '<div><h3 class="text-textMain font-bold mb-1">Email</h3><p class="text-muted text-sm mb-1">' + esc(c.email.desc) + '</p><p class="text-accent font-semibold text-sm">' + esc(c.email.addr) + '</p></div></div>' +
        '<div class="bg-bg2 border border-borderC rounded-2xl p-7 flex items-start gap-5">' +
            '<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl bg-red-500/10 text-red-400">' + icon('pin') + '</div>' +
            '<div><h3 class="text-textMain font-bold mb-1">Zona de Cobertura</h3><p class="text-muted text-sm">' + esc(c.zona) + '</p></div></div>' +
        '<div class="bg-bg2 border border-borderC rounded-2xl p-7 flex items-start gap-5">' +
            '<div class="w-12 h-12 flex-shrink-0 flex items-center justify-center rounded-xl bg-purple-500/10 text-purple-400">' + icon('clock') + '</div>' +
            '<div><h3 class="text-textMain font-bold mb-1">Horarios</h3><p class="text-muted text-sm">' + esc(c.horarios) + '</p></div></div>';

    // Google Maps - replace placeholder with iframe if configured
    var mapSection = document.getElementById('mapSection');
    if (CONFIG.googleMapsEmbed) {
        mapSection.innerHTML =
            '<a href="' + esc(CONFIG.googleMapsUrl || CONFIG.googleMapsEmbed) + '" target="_blank" rel="noopener" class="block w-full h-full">' +
            '<iframe src="' + esc(CONFIG.googleMapsEmbed) + '" width="100%" height="400" style="border:0;" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></a>';
    } else {
        mapSection.innerHTML = '<img src="https://placehold.co/1200x400/1a1a1a/f5a623?text=Mapa+–+' + encodeURIComponent(CONFIG.location) + '" alt="Mapa" class="w-full h-full object-cover">';
    }

    // Footer
    document.getElementById('footerLeft').innerHTML =
        '<span class="text-accent font-extrabold text-sm uppercase">' + esc(CONFIG.businessName) + '</span>' +
        '<span class="text-muted text-xs ml-3">' + esc(CONFIG.tagline) + ' · ' + esc(CONFIG.location) + '</span>';
    document.getElementById('footerRight').innerHTML =
        '<a href="admin.html" class="text-muted hover:text-accent text-xs transition">Admin</a>' +
        '<p class="text-muted text-xs">© ' + new Date().getFullYear() + ' ' + esc(CONFIG.businessName) + '. Todos los derechos reservados.</p>';
}

renderAll();
</script>
</body>
</html>
