<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="">
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <script>
        document.title = CONFIG.meta.title.split('–')[0] + '– Proceso';
        document.querySelector('meta[name="description"]').content = CONFIG.meta.description;
        tailwind.config = {
            theme: { extend: {
                colors: { bg: CONFIG.colors.bg, bg2: CONFIG.colors.bg2, bg3: CONFIG.colors.bg3, accent: CONFIG.colors.accent, accent2: CONFIG.colors.accent2, textMain: CONFIG.colors.textMain, muted: CONFIG.colors.muted, borderC: 'rgba(255,255,255,0.07)' },
                fontFamily: { sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] }
            }}
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0c0c0c; color: #f0ede8; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0c0c0c; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .mobile-menu { transform: translateX(100%); transition: transform 0.3s ease; }
        .mobile-menu.open { transform: translateX(0); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 bg-bg/80 backdrop-blur-md border-b border-borderC">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="text-accent font-extrabold text-xl tracking-tight uppercase" id="navLogo"></a>
        <div class="hidden md:flex items-center gap-8 text-sm text-muted" id="navLinks"></div>
        <button class="md:hidden text-textMain" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
</nav>
<div id="mobileMenu" class="mobile-menu fixed top-0 right-0 w-64 h-full z-50 bg-bg2 border-l border-borderC p-6 pt-20">
    <button class="absolute top-5 right-5 text-textMain" onclick="document.getElementById('mobileMenu').classList.remove('open')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="flex flex-col gap-6 text-sm" id="mobileNavLinks"></div>
</div>

<!-- HERO -->
<section class="pt-32 pb-16 px-6">
    <div class="max-w-7xl mx-auto text-center">
        <div class="inline-block mb-6 px-5 py-2 rounded-full border border-accent/30 bg-accent/5 text-accent text-xs font-medium tracking-widest uppercase">
            Cómo Trabajamos
        </div>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold mb-4">
            <span class="text-textMain">PROCESO </span><span class="text-accent">TRANSPARENTE</span>
        </h1>
        <p class="text-muted text-sm sm:text-base max-w-xl mx-auto leading-relaxed" id="procesoDesc"></p>
    </div>
</section>

<!-- TIMELINE -->
<section class="py-16 px-6">
    <div class="max-w-4xl mx-auto">
        <div id="processTimeline"></div>
    </div>
</section>

<!-- GARANTÍAS -->
<section class="py-24 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <p class="text-accent text-xs font-semibold tracking-widest uppercase mb-2" id="garantiasLabel"></p>
            <h2 class="text-4xl sm:text-5xl font-extrabold">
                <span class="text-textMain">NUESTRAS </span><span class="text-accent">GARANTÍAS</span>
            </h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="guaranteesGrid"></div>
    </div>
</section>

<!-- CTA -->
<section class="py-24 px-6 border-t border-borderC">
    <div class="max-w-3xl mx-auto text-center">
        <h2 class="text-4xl sm:text-5xl font-extrabold mb-6">
            <span class="text-textMain">¿LISTO PARA </span><span class="text-accent">EMPEZAR?</span>
        </h2>
        <p class="text-muted text-sm mb-10" id="ctaText"></p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="contacto.html" class="bg-accent hover:bg-accent2 text-bg font-semibold px-8 py-3.5 rounded-lg transition text-sm">Pedir Presupuesto Gratis</a>
            <a href="servicios.html" class="border border-borderC hover:border-muted text-textMain font-semibold px-8 py-3.5 rounded-lg transition text-sm">Ver Servicios</a>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="py-8 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <div id="footerLeft"></div>
        <div class="flex items-center gap-4" id="footerRight"></div>
    </div>
</footer>

<script>
const ICONS = {
    clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    shield: '<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>',
    money: '<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"/>',
    thumb: '<path d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>'
};

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function icon(name) { return '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.wrench) + '</svg>'; }
function iconLg(name) { return '<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.wrench) + '</svg>'; }
function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }

function renderAll() {
    document.body.style.background = CONFIG.colors.bg;
    document.body.style.color = CONFIG.colors.textMain;

    // Nav
    document.getElementById('navLogo').textContent = CONFIG.businessName;
    document.getElementById('navLinks').innerHTML =
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="' + (l.page === 'proceso.html' ? 'text-textMain font-semibold' : 'hover:text-textMain') + ' transition">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="bg-accent hover:bg-accent2 text-bg font-semibold px-5 py-2 rounded-lg transition">' + esc(CONFIG.nav.ctaLabel) + '</a>';
    document.getElementById('mobileNavLinks').innerHTML =
        '<a href="index.html" class="text-muted hover:text-textMain transition" onclick="closeMobile()">Inicio</a>' +
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="' + (l.page === 'proceso.html' ? 'text-accent font-semibold' : 'text-muted hover:text-textMain transition') + '" onclick="closeMobile()">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="bg-accent hover:bg-accent2 text-bg font-semibold px-5 py-2 rounded-lg transition text-center" onclick="closeMobile()">' + esc(CONFIG.nav.ctaLabel) + '</a>';

    // Hero desc
    document.getElementById('procesoDesc').textContent = CONFIG.procesoDesc;

    // Timeline
    var steps = CONFIG.processDetail;
    document.getElementById('processTimeline').innerHTML = steps.map(function(step, i) {
        var isLast = i === steps.length - 1;
        return '<div class="relative pl-16 ' + (isLast ? '' : 'pb-16 border-l-2 border-accent/20') + ' ml-6">' +
            '<div class="absolute left-0 top-0 -translate-x-1/2 w-12 h-12 bg-accent rounded-full flex items-center justify-center text-bg font-bold text-lg">' + (i + 1) + '</div>' +
            '<div class="bg-bg2 border border-borderC rounded-2xl p-8">' +
            '<h3 class="text-2xl font-extrabold text-textMain mb-2">' + esc(step.title) + '</h3>' +
            '<p class="text-muted text-sm leading-relaxed mb-4">' + esc(step.desc) + '</p>' +
            '<img src="' + esc(step.image) + '" alt="' + esc(step.title) + '" class="rounded-xl border border-borderC w-full object-cover mt-4">' +
            '</div></div>';
    }).join('');

    // Guarantees
    document.getElementById('garantiasLabel').textContent = '¿Por qué ' + CONFIG.businessName + '?';
    document.getElementById('guaranteesGrid').innerHTML = CONFIG.guarantees.map(function(g) {
        return '<div class="bg-bg2 border border-borderC rounded-2xl p-7 text-center">' +
            '<div class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-accent/10 text-accent mb-5">' + iconLg(g.icon) + '</div>' +
            '<h3 class="text-textMain font-bold mb-2">' + esc(g.title) + '</h3>' +
            '<p class="text-muted text-sm leading-relaxed">' + esc(g.desc) + '</p>' +
            '</div>';
    }).join('');

    // CTA
    document.getElementById('ctaText').textContent = CONFIG.ctaSubtitle;

    // Footer
    document.getElementById('footerLeft').innerHTML =
        '<span class="text-accent font-extrabold text-sm uppercase">' + esc(CONFIG.businessName) + '</span>' +
        '<span class="text-muted text-xs ml-3">' + esc(CONFIG.tagline) + ' · ' + esc(CONFIG.location) + '</span>';
    document.getElementById('footerRight').innerHTML =
        '<a href="admin.html" class="text-muted hover:text-accent text-xs transition">Admin</a>' +
        '<p class="text-muted text-xs">© ' + new Date().getFullYear() + ' ' + esc(CONFIG.businessName) + '. Todos los derechos reservados.</p>';
}

renderAll();
</script>
</body>
</html>
