<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="">
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <script>
        document.title = CONFIG.meta.title.split('–')[0] + '– Nosotros';
        document.querySelector('meta[name="description"]').content = CONFIG.meta.description;
        tailwind.config = {
            theme: { extend: {
                colors: { bg: CONFIG.colors.bg, bg2: CONFIG.colors.bg2, bg3: CONFIG.colors.bg3, accent: CONFIG.colors.accent, accent2: CONFIG.colors.accent2, textMain: CONFIG.colors.textMain, muted: CONFIG.colors.muted, borderC: 'rgba(255,255,255,0.07)' },
                fontFamily: { sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'] },
                animation: {
                    'shimmer-slide': 'shimmer-slide var(--speed) ease-in-out infinite alternate',
                    'spin-around': 'spin-around calc(var(--speed) * 2) infinite linear'
                },
                keyframes: {
                    'shimmer-slide': { to: { transform: 'translate(calc(100cqw - 100%), 0)' } },
                    'spin-around': {
                        '0%': { transform: 'translateZ(0) rotate(0)' },
                        '15%, 35%': { transform: 'translateZ(0) rotate(90deg)' },
                        '65%, 85%': { transform: 'translateZ(0) rotate(270deg)' },
                        '100%': { transform: 'translateZ(0) rotate(360deg)' }
                    }
                }
            }}
        }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0c0c0c; color: #f0ede8; font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0c0c0c; } ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .mobile-menu { transform: translateX(100%); transition: transform 0.3s ease; }
        .mobile-menu.open { transform: translateX(0); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 w-full z-50 bg-bg/80 backdrop-blur-md border-b border-borderC">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a href="index.html" class="text-accent font-extrabold text-xl tracking-tight uppercase" id="navLogo"></a>
        <div class="hidden md:flex items-center gap-8 text-sm text-muted" id="navLinks"></div>
        <button class="md:hidden text-textMain" onclick="document.getElementById('mobileMenu').classList.toggle('open')">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>
</nav>
<div id="mobileMenu" class="mobile-menu fixed top-0 right-0 w-64 h-full z-50 bg-bg2 border-l border-borderC p-6 pt-20">
    <button class="absolute top-5 right-5 text-textMain" onclick="document.getElementById('mobileMenu').classList.remove('open')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="flex flex-col gap-6 text-sm" id="mobileNavLinks"></div>
</div>

<!-- HERO -->
<section class="pt-32 pb-16 px-6">
    <div class="max-w-7xl mx-auto text-center">
        <div class="inline-block mb-6 px-5 py-2 rounded-full border border-accent/30 bg-accent/5 text-accent text-xs font-medium tracking-widest uppercase">
            Nosotros
        </div>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold mb-4" id="aboutHeading"></h1>
        <p class="text-muted text-sm sm:text-base max-w-xl mx-auto leading-relaxed" id="aboutDesc"></p>
    </div>
</section>

<!-- MISIÓN Y VISIÓN -->
<section class="py-16 px-6">
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6" id="missionVision"></div>
</section>

<!-- VALORES -->
<section class="py-24 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto">
        <div class="text-center mb-16">
            <p class="text-accent text-xs font-semibold tracking-widest uppercase mb-2">Lo que nos define</p>
            <h2 class="text-4xl sm:text-5xl font-extrabold">
                <span class="text-textMain">NUESTROS </span><span class="text-accent">VALORES</span>
            </h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="valuesGrid"></div>
    </div>
</section>

<!-- EQUIPO -->
<section class="py-24 px-6 border-t border-borderC">
    <div class="max-w-4xl mx-auto text-center">
        <p class="text-accent text-xs font-semibold tracking-widest uppercase mb-2">Nuestro equipo</p>
        <h2 class="text-4xl sm:text-5xl font-extrabold mb-8">
            <span class="text-textMain">PROFESIONALES </span><span class="text-accent">ESPECIALIZADOS</span>
        </h2>
        <p class="text-muted text-sm sm:text-base leading-relaxed" id="teamDesc"></p>
    </div>
</section>

<!-- CTA -->
<section class="py-24 px-6 border-t border-borderC">
    <div class="max-w-3xl mx-auto text-center">
        <h2 class="text-4xl sm:text-5xl font-extrabold mb-6">
            <span class="text-textMain">¿NECESITÁS UN </span><span class="text-accent">PRESUPUESTO?</span>
        </h2>
        <p class="text-muted text-sm mb-10" id="ctaText"></p>
        <a href="contacto.html" class="inline-block bg-accent hover:bg-accent2 text-bg font-semibold px-8 py-3.5 rounded-lg transition text-sm">Pedir Presupuesto Gratis</a>
    </div>
</section>

<!-- FOOTER -->
<footer class="py-8 px-6 border-t border-borderC">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <div id="footerLeft"></div>
        <div class="flex items-center gap-4" id="footerRight"></div>
    </div>
</footer>

<script>
const ICONS = {
    star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>',
    shield: '<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>',
    check: '<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
    wrench: '<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>'
};

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function icon(name) { return '<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.wrench) + '</svg>'; }
function iconLg(name) { return '<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">' + (ICONS[name] || ICONS.wrench) + '</svg>'; }
function closeMobile() { document.getElementById('mobileMenu').classList.remove('open'); }

function shimmerCard(content, extraClass) {
    return '<div class="group relative z-0 overflow-hidden rounded-2xl border border-borderC hover:border-accent/30 transition-colors duration-500 ' + (extraClass || '') + '" style="--spread:90deg;--shimmer-color:' + CONFIG.colors.accent + ';--radius:1rem;--speed:3s;--cut:1px;--bg:' + CONFIG.colors.bg2 + ';">' +
        '<div class="absolute inset-0 overflow-visible [container-type:size] -z-30 blur-[2px] opacity-0 group-hover:opacity-100 transition-opacity duration-500">' +
            '<div class="absolute inset-0 h-[100cqh] animate-shimmer-slide [aspect-ratio:1] [border-radius:0] [mask:none]">' +
                '<div class="animate-spin-around absolute -inset-full w-auto rotate-0 [background:conic-gradient(from_calc(270deg-(var(--spread)*0.5)),transparent_0,var(--shimmer-color)_var(--spread),transparent_var(--spread))] [translate:0_0]"></div>' +
            '</div>' +
        '</div>' +
        '<div class="absolute -z-20 [background:var(--bg)] [border-radius:var(--radius)] [inset:var(--cut)]"></div>' +
        '<div class="relative z-10 p-7">' + content + '</div>' +
    '</div>';
}

function renderAll() {
    document.body.style.background = CONFIG.colors.bg;
    document.body.style.color = CONFIG.colors.textMain;

    var ab = CONFIG.about;

    // Nav (highlight "Nosotros")
    document.getElementById('navLogo').textContent = CONFIG.businessName;
    document.getElementById('navLinks').innerHTML =
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="' + (l.page === 'about.html' ? 'text-textMain font-semibold' : 'hover:text-textMain') + ' transition">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="bg-accent hover:bg-accent2 text-bg font-semibold px-5 py-2 rounded-lg transition">' + esc(CONFIG.nav.ctaLabel) + '</a>';
    document.getElementById('mobileNavLinks').innerHTML =
        '<a href="index.html" class="text-muted hover:text-textMain transition" onclick="closeMobile()">Inicio</a>' +
        CONFIG.nav.links.map(function(l) {
            return '<a href="' + l.page + '" class="' + (l.page === 'about.html' ? 'text-accent font-semibold' : 'text-muted hover:text-textMain transition') + '" onclick="closeMobile()">' + esc(l.label) + '</a>';
        }).join('') +
        '<a href="' + CONFIG.nav.ctaPage + '" class="bg-accent hover:bg-accent2 text-bg font-semibold px-5 py-2 rounded-lg transition text-center" onclick="closeMobile()">' + esc(CONFIG.nav.ctaLabel) + '</a>';

    // Hero
    document.getElementById('aboutHeading').innerHTML =
        '<span class="text-textMain">' + esc(ab.heading1) + ' </span><span class="text-accent">' + esc(ab.heading2) + '</span>';
    document.getElementById('aboutDesc').textContent = ab.description;

    // Mission & Vision (two shimmerCards side by side)
    document.getElementById('missionVision').innerHTML =
        shimmerCard(
            '<div class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-accent/10 text-accent mb-5">' +
            '<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>' +
            '<h3 class="text-xl font-bold text-textMain mb-3 text-center">Nuestra Misión</h3>' +
            '<p class="text-muted text-sm leading-relaxed text-center">' + esc(ab.mission) + '</p>',
            'text-center'
        ) +
        shimmerCard(
            '<div class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-accent/10 text-accent mb-5">' +
            '<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div>' +
            '<h3 class="text-xl font-bold text-textMain mb-3 text-center">Nuestra Visión</h3>' +
            '<p class="text-muted text-sm leading-relaxed text-center">' + esc(ab.vision) + '</p>',
            'text-center'
        );

    // Values (shimmerCards with icons from ICONS map)
    document.getElementById('valuesGrid').innerHTML = ab.values.map(function(v) {
        return shimmerCard(
            '<div class="w-14 h-14 mx-auto flex items-center justify-center rounded-xl bg-accent/10 text-accent mb-5">' + iconLg(v.icon) + '</div>' +
            '<h3 class="text-textMain font-bold mb-2">' + esc(v.title) + '</h3>' +
            '<p class="text-muted text-sm leading-relaxed">' + esc(v.desc) + '</p>',
            'text-center'
        );
    }).join('');

    // Team
    document.getElementById('teamDesc').textContent = ab.teamDescription;

    // CTA
    document.getElementById('ctaText').textContent = CONFIG.ctaSubtitle;

    // Footer
    document.getElementById('footerLeft').innerHTML =
        '<span class="text-accent font-extrabold text-sm uppercase">' + esc(CONFIG.businessName) + '</span>' +
        '<span class="text-muted text-xs ml-3">' + esc(CONFIG.tagline) + ' · ' + esc(CONFIG.location) + '</span>';
    document.getElementById('footerRight').innerHTML =
        '<a href="admin.html" class="text-muted hover:text-accent text-xs transition">Admin</a>' +
        '<p class="text-muted text-xs">© ' + new Date().getFullYear() + ' ' + esc(CONFIG.businessName) + '. Todos los derechos reservados.</p>';
}

renderAll();
</script>
</body>
</html>
